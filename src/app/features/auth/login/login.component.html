<div class="login-container d-flex flex-column min-vh-100">
  <!-- Top Bar -->
  <header class="navbar navbar-light bg-white border-bottom px-4 py-2">
    <span class="navbar-brand mb-0 h1">Title Text</span>
    <div class="user-icon">
      <i class="bi bi-person-circle fs-3"></i>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center p-4">
    <div class="card login-card shadow-sm overflow-hidden">
      <div class="row g-0">
        <!-- Left Side: Form -->
        <div class="col-md-5 p-5 d-flex flex-column justify-content-center">
          <div class="text-center mb-4">
            <div class="logo-placeholder bg-light border p-4 mb-3 d-inline-block w-100">
              <h2 class="mb-0">Title text</h2>
            </div>
            <p class="text-muted">Subtitle text</p>
          </div>

          <form (ngSubmit)="onSubmit()">
            <div class="mb-3 position-relative">
              <input
                type="email"
                class="form-control form-control-lg pe-5"
                placeholder="Email Address"
                name="email"
                [(ngModel)]="loginData.email"
                required
              />
              <i
                class="bi bi-envelope position-absolute top-50 end-0 translate-middle-y me-3 text-muted fs-5"
              ></i>
            </div>

            <div class="mb-3 position-relative">
              <input
                type="password"
                class="form-control form-control-lg pe-5"
                placeholder="Password"
                name="password"
                [(ngModel)]="loginData.password"
                required
              />
              <i
                class="bi bi-lock position-absolute top-50 end-0 translate-middle-y me-3 text-muted fs-5"
              ></i>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="rememberMe"
                  name="rememberMe"
                  [(ngModel)]="loginData.rememberMe"
                />
                <label class="form-check-label small" for="rememberMe">Remember me</label>
              </div>
              <a href="#" class="small text-decoration-none">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-secondary btn-lg w-100 mb-3 py-2">LOGIN</button>

            <div class="text-center">
              <span class="small text-muted">Don't have an account? </span>
              <a href="#" class="small text-decoration-none fw-bold">Sign Up</a>
            </div>
          </form>
        </div>

        <!-- Right Side: Image -->
        <div
          class="col-md-7 bg-light d-none d-md-flex align-items-center justify-content-center border-start"
        >
          <div class="text-center p-5">
            <h3 class="text-muted opacity-50 font-monospace">IMAGEN AQUÍ</h3>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

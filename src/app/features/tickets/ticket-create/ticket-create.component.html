<!-- Page Header -->
<div class="page-title-row d-flex justify-content-between align-items-center mb-4">
  <div>
    <h1 class="page-title">Crear Nuevo Ticket</h1>
    <p class="page-subtitle">Completa la información para registrar una nueva incidencia</p>
  </div>
  <button class="btn-back" routerLink="/tickets">
    <i class="bi bi-arrow-left me-1"></i>
    Volver al listado
  </button>
</div>

<!-- Form Card -->
<div class="form-card">
  <form (ngSubmit)="onSubmit()" #ticketForm="ngForm">

    <!-- Title -->
    <div class="form-group">
      <label class="form-label" for="title">
        Asunto <span class="required">*</span>
      </label>
      <input
        type="text"
        id="title"
        class="form-control-custom"
        placeholder="Ej: No puedo acceder al sistema de correo"
        [(ngModel)]="ticket.title"
        name="title"
        required
        #titleField="ngModel"
      >
      @if (titleField.invalid && titleField.touched) {
        <span class="field-error">El asunto es obligatorio</span>
      }
    </div>

    <!-- Category & Priority Row -->
    <div class="form-row">
      <div class="form-group flex-1">
        <label class="form-label" for="category">Categoría</label>
        <select
          id="category"
          class="form-control-custom"
          [(ngModel)]="ticket.category"
          name="category"
        >
          <option value="">Seleccionar categoría...</option>
          @for (cat of categories; track cat) {
            <option [value]="cat">{{ cat }}</option>
          }
        </select>
      </div>

      <div class="form-group flex-1">
        <label class="form-label" for="priority">Prioridad</label>
        <select
          id="priority"
          class="form-control-custom"
          [(ngModel)]="ticket.priority"
          name="priority"
        >
          @for (p of priorities; track p) {
            <option [value]="p">{{ priorityLabels[p] }}</option>
          }
        </select>
      </div>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label class="form-label" for="description">
        Descripción <span class="required">*</span>
      </label>
      <textarea
        id="description"
        class="form-control-custom textarea"
        placeholder="Describe el problema con el mayor detalle posible..."
        rows="6"
        [(ngModel)]="ticket.description"
        name="description"
        required
        #descField="ngModel"
      ></textarea>
      @if (descField.invalid && descField.touched) {
        <span class="field-error">La descripción es obligatoria</span>
      }
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="cancel()">
        Cancelar
      </button>
      <button
        type="submit"
        class="btn-submit"
        [disabled]="submitting || !ticket.title.trim() || !ticket.description.trim()"
      >
        @if (submitting) {
          <span class="spinner"></span>
          Creando...
        } @else {
          <i class="bi bi-plus-lg me-1"></i>
          Crear Ticket
        }
      </button>
    </div>

  </form>
</div>

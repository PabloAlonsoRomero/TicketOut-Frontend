<div class="sidebar d-flex flex-column vh-100 text-white p-3" style="width: 260px; min-width: 260px;">
  <!-- Brand -->
  <div class="d-flex align-items-center mb-4 px-2">
    <i class="bi bi-ticket-perforated-fill fs-4 me-2" style="color: #f97316;"></i>
    <span class="fw-bold fs-5">TicketOut</span>
  </div>

  <!-- User Info -->
  <div class="d-flex align-items-center p-3 mb-3 rounded bg-white bg-opacity-10 border border-white border-opacity-25">
    <div class="bg-white bg-opacity-25 rounded-circle d-flex align-items-center justify-content-center me-3"
         style="width: 38px; height: 38px;">
      <i class="bi bi-person-fill"></i>
    </div>
    <div class="flex-grow-1">
      <div class="fw-bold small text-truncate">{{ userName }}</div>
      <div class="small opacity-75 text-truncate">{{ userRole }}</div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="nav flex-column flex-grow-1">
    <a *ngFor="let item of menuItems"
       class="nav-link text-white d-flex align-items-center px-3 py-2 mb-1 rounded"
       [routerLink]="item.route"
       routerLinkActive="bg-white bg-opacity-25"
       [routerLinkActiveOptions]="{exact: false}">
      <i class="bi {{ item.icon }} me-3 fs-5"></i>
      <span class="flex-grow-1">{{ item.label }}</span>
      <span *ngIf="item.badge" class="sidebar-badge ms-2">{{ item.badge }}</span>
    </a>
  </nav>

  <!-- Logout Button -->
  <div class="mt-auto">
    <button class="sidebar-logout w-100 d-flex align-items-center justify-content-center"
            (click)="logout()">
      <i class="bi bi-box-arrow-right me-2"></i>
      <span>Cerrar Sesión</span>
    </button>
  </div>
</div>
